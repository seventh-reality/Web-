<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebXR AR with Three.js</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/examples/js/webxr/ARButton.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #ui-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 10px;
      border-radius: 8px;
    }
    button {
      background: #007bff;
      color: white;
      padding: 10px 15px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div id="ui-overlay">
    <button id="toggleModel">Toggle Model</button>
    <button id="toggleAnimation">Toggle Animation</button>
  </div>
  <script>
    let camera, scene, renderer, controller;
    let currentModel = null;
    let animationMixer = null;
    let animationPlaying = true;

    function init() {
      // Initialize Scene
      scene = new THREE.Scene();

      // Initialize Camera
      camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        20
      );

      // Initialize Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Add ARButton to enable WebXR
      document.body.appendChild(THREE.ARButton.createButton(renderer));

      // Add Light to the Scene
      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      light.position.set(0.5, 1, 0.25);
      scene.add(light);

      // Add Controller for Interaction
      controller = renderer.xr.getController(0);
      scene.add(controller);

      loadModel();
    }

    function loadModel() {
      const loader = new THREE.GLTFLoader();
      loader.load(
        'https://modelviewer.dev/shared-assets/models/Astronaut.glb',
        (gltf) => {
          // Add Loaded Model to Scene
          currentModel = gltf.scene;
          currentModel.scale.set(0.2, 0.2, 0.2);
          currentModel.position.set(0, 0, -1); // Position 1 meter in front of user
          scene.add(currentModel);

          // Setup Animation if Available
          if (gltf.animations.length > 0) {
            animationMixer = new THREE.AnimationMixer(currentModel);
            const action = animationMixer.clipAction(gltf.animations[0]);
            action.play();
          }
        },
        undefined,
        (error) => {
          console.error('Error loading model:', error);
        }
      );
    }

    function toggleAnimation() {
      if (animationMixer && currentModel) {
        const action = animationMixer.clipAction(currentModel.animations[0]);
        if (animationPlaying) {
          action.stop();
        } else {
          action.play();
        }
        animationPlaying = !animationPlaying;
      }
    }

    function animate() {
      renderer.setAnimationLoop(() => {
        if (animationMixer) animationMixer.update(0.01);
        renderer.render(scene, camera);
      });
    }

    // Event Listeners
    document.getElementById('toggleModel').addEventListener('click', loadModel);
    document.getElementById('toggleAnimation').addEventListener('click', toggleAnimation);

    init();
    animate();
  </script>
</body>
</html>
