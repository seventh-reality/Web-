<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web AR Model Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      overflow: hidden;
    }
    #overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      background: #007bff;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #0056b3;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
      margin: 0;
      display: block;
    }
  </style>
</head>
<body>
  <!-- AR-enabled Model Viewer -->
  <model-viewer
    id="modelViewer"
    src="Steerad.glb"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    interaction-prompt="auto"
    animation-name="idle"
    environment-image="neutral"
    exposure="1"
    auto-rotate
    shadow-intensity="1">
  </model-viewer>

  <!-- Overlay with control buttons -->
  <div id="overlay">
    <button onclick="toggleAnimation()">Toggle Animation</button>
    <button onclick="placeModel()">Start AR View</button>
  </div>

  <script>
    const modelViewer = document.getElementById('modelViewer');
    let animationPlaying = true;

    // Toggle model animation
    function toggleAnimation() {
      if (animationPlaying) {
        modelViewer.pause();
      } else {
        modelViewer.play();
      }
      animationPlaying = !animationPlaying;
    }

    // Trigger AR view
    function placeModel() {
      modelViewer.activateAR();
    }

    // Debug: Log AR status
    modelViewer.addEventListener('ar-status', (event) => {
      if (event.detail.status === 'failed') {
        console.error('AR failed to start.');
        alert('AR mode is not supported or failed to start.');
      } else {
        console.log(`AR status: ${event.detail.status}`);
      }
    });
  </script>
</body>
</html>
