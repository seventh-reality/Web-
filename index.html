<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web AR Model Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      overflow: hidden;
    }
    #overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      border-radius: 8px;
    }
    button {
      background: #007bff;
      color: white;
      padding: 10px 15px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #0056b3;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
      margin: 0;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Overlay with control buttons -->
 

  <!-- AR-enabled Model Viewer -->
  <model-viewer
    id="modelViewer"
    src="Steerad.glb"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    interaction-prompt="auto"
    animation-name="idle"
    environment-image="neutral"
    skybox-image="neutral"
    exposure="1"
    auto-rotate
    shadow-intensity="1"
    style="display: block;">
     <div id="overlay">
    <button onclick="toggleAnimation()">Toggle Animation</button>
    <button onclick="placeModel()">Place Model</button>
  </div>
    
  </model-viewer>

  <script>
    const modelViewer = document.getElementById('modelViewer');
    let animationPlaying = true;

    // Toggle model animation
    function toggleAnimation() {
      if (animationPlaying) {
        modelViewer.pause();
      } else {
        modelViewer.play();
      }
      animationPlaying = !animationPlaying;
    }

    // Place model on surface
    function placeModel() {
      modelViewer.activateAR();
    }

    // Event listener for model click to toggle animation
    modelViewer.addEventListener('click', () => {
      toggleAnimation();
    });

    // Debug: Log AR status
    modelViewer.addEventListener('ar-status', (event) => {
      console.log(`AR status: ${event.detail.status}`);
    });
  </script>
</body>
</html>
