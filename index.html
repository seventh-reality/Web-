<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web AR - Model Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js/three.min.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 10px;
      border-radius: 5px;
      font-family: Arial, sans-serif;
    }
    button {
      background: #007bff;
      color: white;
      padding: 10px 15px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <button onclick="toggleAnimation()">Toggle Animation</button>
  </div>

  <script>
    let scene, camera, renderer, model, mixer, clock, animationActive = false;
    let reticle;

    // Initialize Three.js scene
    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      clock = new THREE.Clock();

      // Add light
      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      light.position.set(0, 1, 0);
      scene.add(light);

      // Orbit Controls for debugging (disable in production)
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0);
      controls.update();

      // AR.js markerless SLAM
      const arToolkitSource = new THREEx.ArToolkitSource({ sourceType: 'webcam' });
      arToolkitSource.init(() => onResize());
      window.addEventListener('resize', () => onResize());

      const arToolkitContext = new THREEx.ArToolkitContext({
        cameraParametersUrl: 'https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js/data/camera_para.dat',
        detectionMode: 'mono_and_matrix',
        matrixCodeType: '4x4',
      });

      arToolkitContext.init(() => camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix()));

      scene.visible = false;

      // Surface tracking (reticle)
      const geometry = new THREE.RingGeometry(0.1, 0.15, 32).rotateX(-Math.PI / 2);
      const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
      reticle = new THREE.Mesh(geometry, material);
      reticle.visible = false;
      scene.add(reticle);

      // Load 3D model
      const loader = new THREE.GLTFLoader();
      loader.load('Steerad.glb', (gltf) => {
        model = gltf.scene;
        scene.add(model);

        // Animation setup
        mixer = new THREE.AnimationMixer(model);
        gltf.animations.forEach((clip) => {
          mixer.clipAction(clip).play();
        });
        model.visible = false;
      });

      animate();
    }

    // Handle AR surface interactions
    function onSurfaceClick() {
      if (!model || !reticle.visible) return;
      model.position.copy(reticle.position);
      model.visible = true;
      animationActive = true;
    }

    function toggleAnimation() {
      if (!mixer) return;
      animationActive = !animationActive;
    }

    // Handle window resize
    function onResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      if (mixer && animationActive) mixer.update(clock.getDelta());
      renderer.render(scene, camera);
    }

    window.addEventListener('click', onSurfaceClick);

    init();
  </script>
</body>
</html>
