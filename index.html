<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model Editor with Click Interaction</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin: 0; }
    model-viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <!-- Model Viewer -->
  <model-viewer 
    id="modelViewer"
    alt="Neil Armstrong's Spacesuit from the Smithsonian Digitization Programs Office and National Air and Space Museum"
    src="https://modelviewer.dev/shared-assets/models/NeilArmstrong.glb"
    ar 
    ar-modes="webxr scene-viewer quick-look"
    environment-image="https://modelviewer.dev/shared-assets/environments/moon_1k.hdr"
    poster="https://modelviewer.dev/shared-assets/models/NeilArmstrong.webp"
    shadow-intensity="1"
    camera-controls
    touch-action="pan-y">
  </model-viewer>

  <script>
    // Get the model-viewer element
    const modelViewer = document.querySelector('#modelViewer');

    // Initialize a three.js Raycaster and a Mouse Vector2
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // Set up event listener for clicks on the model-viewer canvas
    modelViewer.addEventListener('click', async (event) => {
      // Wait for the model to load
      await modelViewer.updateComplete;

      // Get the bounding rect of the model-viewer
      const rect = modelViewer.getBoundingClientRect();

      // Calculate normalized device coordinates of the click
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      // Get the 3D scene from model-viewer
      const scene = modelViewer.model?.scene;
      const camera = modelViewer.getCamera();

      if (!scene) {
        console.error('Model scene not found!');
        return;
      }

      // Update the raycaster with the camera and mouse position
      raycaster.setFromCamera(mouse, camera);

      // Get all intersected objects
      const intersects = raycaster.intersectObjects(scene.children, true);

      if (intersects.length > 0) {
        // Get the first intersected object
        const intersectedObject = intersects[0].object;

        // Toggle visibility
        intersectedObject.visible = !intersectedObject.visible;

        console.log(`Toggled visibility of: ${intersectedObject.name}`);
      } else {
        console.log('No object hit.');
      }
    });
  </script>
</body>
</html>
