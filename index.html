<script>
  const arButton = document.getElementById('arButton');
  const _3dButton = document.getElementById('3dButton');
  const hamburger = document.getElementById('hamburger');
  const menuCard = document.getElementById('menuCard');
  const infoIcon = document.getElementById('infoIcon'); // Add this line
  const menuIconHamburger = document.querySelector('.menu_icon_hamburger'); // Add this line
  const shareUrlBtn=document.getElementById('shareUrl')
  const muteButton=document.getElementById('muteButton')

    // Get all audio and video elements
  var mediaElements = document.querySelectorAll('audio, video');

 _3dButton.addEventListener('click',()=>{
     window.location.reload();
 })
  hamburger.addEventListener('click', () => {
    menuCard.classList.toggle('active');
    hamburger.style.display = 'none'; // Hide hamburger when clicked
  });

  infoIcon.addEventListener('click', () => { // Add this block
    const carousel = document.querySelector('.carousel-default');
    carousel.classList.add('active');
    menuCard.classList.remove('active'); // Close the hamburger menu
    hamburger.style.display = 'none'; // Hide hamburger when clicked
// Show hamburger icon

  });

  const closeCarousel = document.getElementById('closeCarousel');
  const closeCarouselDefault = document.getElementById('closeCarouselInfo');

  closeCarousel.addEventListener('click', () => {
    const carousel = document.querySelector('.carousel-default');
    carousel.classList.remove('active');
    menuCard.classList.toggle('active');
    hamburger.style.display = 'flex'; // Show hamburger when menu icon is clicked

  });
  closeCarouselDefault.addEventListener('click', () => {
    const carousel = document.querySelector('.carousel-default');
    carousel.classList.remove('active');
    menuCard.classList.toggle('active');
  });
 shareUrlBtn.addEventListener('click', function() {
  // Get the current URL
  var currentURL = window.location.href;
  
  // Check if the browser supports the Web Share API
  if (navigator.share) {
    navigator.share({
      title: document.title,
      text: 'Check out this webpage:',
      url: currentURL,
    })
    .then(() => console.log('Shared successfully'))
    .catch((error) => console.log('Error sharing:', error));
  } else {
    // Fallback for browsers that don't support Web Share API
    alert("Your browser doesn't support sharing.");
  }
})
let currentIndex = 0;
const items = document.querySelectorAll('.item');

function showSlide(index) {
  if (index >= items.length) {
    index = 0;
  } else if (index < 0) {
    index = items.length - 1;
  }

  items.forEach((item, i) => {
    if (i === index) {
      item.classList.add('active');
    } else {
      item.classList.remove('active');
    }
  });

  currentIndex = index;
}

function changeSlide(direction) {
  showSlide(currentIndex + direction);
}

showSlide(currentIndex);


</script>
