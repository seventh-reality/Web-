<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web AR Platform</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/1.7.2/aframe/build/aframe-ar.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #canvas-buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        .btn {
            padding: 10px 20px;
            margin: 0 5px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<!-- AR Scene -->
<a-scene embedded arjs>
    <!-- Light -->
    <a-light type="ambient" intensity="0.8"></a-light>
    <a-light type="point" intensity="1" position="2 4 4"></a-light>

    <!-- Models -->
    <a-entity id="model1" gltf-model="assets/SC_Kiosk.glb" position="0 0 0" scale="0.5 0.5 0.5" animation-mixer></a-entity>
    <a-entity id="model2" gltf-model="assets/big_ben.glb" position="0 0 0" scale="0.5 0.5 0.5" visible="false" animation-mixer></a-entity>

    <!-- Clickable Plane for Touch Interaction -->
    <a-entity geometry="primitive: plane; height: 2; width: 2" position="0 0 -1" material="opacity: 0; transparent: true" id="interaction-plane"></a-entity>
</a-scene>

<!-- Canvas Buttons -->
<div id="canvas-buttons">
    <button class="btn" onclick="switchModel('model1')">Show Model 1</button>
    <button class="btn" onclick="switchModel('model2')">Show Model 2</button>
</div>

<script>
    let currentModel = 'model1';

    // Function to switch models
    function switchModel(modelId) {
        const model1 = document.getElementById('model1');
        const model2 = document.getElementById('model2');

        if (modelId === 'model1') {
            model1.setAttribute('visible', 'true');
            model2.setAttribute('visible', 'false');
        } else {
            model1.setAttribute('visible', 'false');
            model2.setAttribute('visible', 'true');
        }

        currentModel = modelId;
    }

    // Add touch interaction to play animation and voiceover
    const interactionPlane = document.getElementById('interaction-plane');
    interactionPlane.addEventListener('click', () => {
        const model = document.getElementById(currentModel);
        const voiceover = new Audio(`${currentModel}.mp3`); // Assuming voiceover files are named model1.mp3, model2.mp3

        // Play animation
        model.setAttribute('animation-mixer', '');

        // Play voiceover
        voiceover.play();
    });
</script>

</body>
</html>
