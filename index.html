<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model Editor with AR</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.8);
      padding: 10px;
      border-radius: 8px;
    }
    #ui button {
      margin: 5px 0;
      padding: 8px;
      border: none;
      border-radius: 4px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
    #ui button:hover {
      background: #0056b3;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <!-- Model Viewer -->
  <model-viewer 
    id="modelViewer"
    alt="Neil Armstrong's Spacesuit from the Smithsonian Digitization Programs Office and National Air and Space Museum"
    src="https://modelviewer.dev/shared-assets/models/NeilArmstrong.glb"
    ar 
    ar-modes="webxr scene-viewer quick-look"
    environment-image="https://modelviewer.dev/shared-assets/environments/moon_1k.hdr"
    poster="https://modelviewer.dev/shared-assets/models/NeilArmstrong.webp"
    shadow-intensity="1"
    camera-controls
    touch-action="pan-y">
  </model-viewer>

  <!-- UI for toggling parts -->
  <div id="ui">
    <button id="toggleHelmet">Toggle Helmet</button>
    <button id="toggleSuit">Toggle Suit</button>
    <button id="listParts">List Parts</button>
  </div>

  <script>
    // Get the <model-viewer> instance
    const modelViewer = document.querySelector('#modelViewer');

    // Helper to find a part by name
    async function findMeshByName(name) {
      // Wait for the model to load
      await modelViewer.updateComplete;

      // Access the 3D scene
      const scene = modelViewer.model?.scene;
      if (!scene) {
        console.error('Model scene not found!');
        return null;
      }

      // Traverse the scene to find the mesh by name
      let foundMesh = null;
      scene.traverse((node) => {
        if (node.name === name) {
          foundMesh = node;
        }
      });
      return foundMesh;
    }

    // Debugging function to list all part names
    async function listAllParts() {
      await modelViewer.updateComplete;
      const scene = modelViewer.model?.scene;

      if (!scene) {
        console.error('Model scene not found!');
        return;
      }

      console.log("Available parts in the model:");
      scene.traverse((node) => {
        if (node.name) {
          console.log(node.name);
        }
      });
    }

    // Add toggle functionality for Helmet
    document.getElementById('toggleHelmet').addEventListener('click', async () => {
      const helmet = await findMeshByName('Helmet'); // Replace "Helmet" with the actual part name
      if (helmet) {
        helmet.visible = !helmet.visible; // Toggle visibility
      } else {
        alert('Helmet not found! Check the console for available parts.');
        listAllParts();
      }
    });

    // Add toggle functionality for Suit
    document.getElementById('toggleSuit').addEventListener('click', async () => {
      const suit = await findMeshByName('Suit'); // Replace "Suit" with the actual part name
      if (suit) {
        suit.visible = !suit.visible; // Toggle visibility
      } else {
        alert('Suit not found! Check the console for available parts.');
        listAllParts();
      }
    });

    // Button to list all parts in the console
    document.getElementById('listParts').addEventListener('click', listAllParts);
  </script>
</body>
</html>
