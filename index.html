<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web AR Platform with Surface Tracking</title>

    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Load AR.js for SLAM -->
    <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/1.7.2/three.js/build/ar.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #canvas-buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        .btn {
            padding: 10px 20px;
            margin: 0 5px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <!-- Canvas for Three.js -->
    <div id="ar-scene"></div>

    <!-- Canvas Buttons -->
    <div id="canvas-buttons">
        <button class="btn" onclick="start3DView()">Start 3D View</button>
        <button class="btn" onclick="startARView()">Start AR View</button>
    </div>

    <script>
        // Initialize Three.js scene, camera, and renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('ar-scene').appendChild(renderer.domElement);

        // AR.js setup
        const arToolkitSource = new THREEx.ArToolkitSource({
            sourceType: 'webcam',
        });
        const arToolkitContext = new THREEx.ArToolkitContext({
            cameraParametersUrl: 'https://cdn.rawgit.com/jeromeetienne/ar.js/1.7.2/three.js/data/camera_para.dat',
            detectionMode: 'mono',
        });

        // Resize event listener
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        // Add light to the scene
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(2, 4, 4);
        scene.add(pointLight);

        // Load Model
        const loader = new THREE.GLTFLoader();
        let model = null;

        loader.load('assets/SC_Kiosk.glb', (gltf) => {
            model = gltf.scene;
            model.scale.set(0.5, 0.5, 0.5);
            model.visible = false; // Initially hidden
            scene.add(model);
        });

        // Raycaster for detecting clicks
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Surface click handler
        function onSurfaceClick(event) {
            // Convert mouse position to normalized device coordinates
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Update raycaster
            raycaster.setFromCamera(mouse, camera);

            // Detect intersection
            const intersects = raycaster.intersectObjects(scene.children, true);
            if (intersects.length > 0) {
                const intersect = intersects[0];

                // Place model at the clicked position
                if (model) {
                    model.visible = true;
                    model.position.copy(intersect.point);
                }
            }
        }

        // 3D View Animation Loop
        function start3DView() {
            renderer.domElement.addEventListener('click', onSurfaceClick);

            function animate() {
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }
            animate();
        }

        // AR View Initialization and Loop
        function startARView() {
            arToolkitSource.init(() => {
                arToolkitSource.onResizeElement();
                arToolkitSource.copyElementSizeTo(renderer.domElement);
                arToolkitContext.init(() => {
                    camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
                });

                function arLoop() {
                    if (arToolkitSource.ready && arToolkitContext.arController !== null) {
                        arToolkitContext.update(arToolkitSource.domElement);
                    }
                    renderer.render(scene, camera);
                    requestAnimationFrame(arLoop);
                }
                arLoop();
            });

            renderer.domElement.addEventListener('click', onSurfaceClick);
        }

        // Start with 3D view by default
        start3DView();
    </script>
</body>
</html>
