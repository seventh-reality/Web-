<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web AR Platform with SLAM</title>

    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Load AR.js for SLAM -->
    <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/1.7.2/three.js/build/ar.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #canvas-buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        .btn {
            padding: 10px 20px;
            margin: 0 5px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <!-- Canvas for Three.js -->
    <div id="ar-scene"></div>

    <!-- Canvas Buttons -->
    <div id="canvas-buttons">
        <button class="btn" onclick="switchModel('model1')">Show Model 1</button>
        <button class="btn" onclick="switchModel('model2')">Show Model 2</button>
    </div>

    <script>
        // Initialize Three.js scene, camera, and renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('ar-scene').appendChild(renderer.domElement);

        // AR.js setup for SLAM
        const arToolkitSource = new THREEx.ArToolkitSource({
            sourceType: 'webcam',
        });
        arToolkitSource.init(() => setTimeout(() => onResize(), 2000));

        const arToolkitContext = new THREEx.ArToolkitContext({
            cameraParametersUrl: 'https://cdn.rawgit.com/jeromeetienne/ar.js/1.7.2/three.js/data/camera_para.dat',
            detectionMode: 'mono',
            maxDetectionRate: 60,
        });
        arToolkitContext.init(() => camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix()));

        window.addEventListener('resize', onResize);
        function onResize() {
            arToolkitSource.onResizeElement();
            arToolkitSource.copyElementSizeTo(renderer.domElement);
            if (arToolkitContext.arController !== null) {
                arToolkitSource.copyElementSizeTo(arToolkitContext.arController.canvas);
            }
        }

        // Create light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(2, 4, 4);
        scene.add(pointLight);

        // Load Models
        const loader = new THREE.GLTFLoader();
        const models = {};
        let currentModel = null;

        loader.load('assets/SC_Kiosk.glb', (gltf) => {
            models.model1 = gltf.scene;
            models.model1.scale.set(0.5, 0.5, 0.5);
            models.model1.visible = true;
            scene.add(models.model1);
            currentModel = models.model1;
        });

        loader.load('assets/big_ben.glb', (gltf) => {
            models.model2 = gltf.scene;
            models.model2.scale.set(0.5, 0.5, 0.5);
            models.model2.visible = false;
            scene.add(models.model2);
        });

        // Function to switch models
        function switchModel(modelId) {
            if (models[modelId]) {
                for (let key in models) {
                    models[key].visible = false;
                }
                models[modelId].visible = true;
                currentModel = models[modelId];
            }
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            if (arToolkitSource.ready && arToolkitContext.arController !== null) {
                arToolkitContext.update(arToolkitSource.domElement);
            }
            renderer.render(scene, camera);
        }

        // Start animation
        animate();
    </script>
</body>
</html>
